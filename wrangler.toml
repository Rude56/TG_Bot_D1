name = "tg-contact-bot"
main = "TG_Bot_D1.js"
compatibility_date = "2024-09-23"

# D1 数据库绑定（变量名必须为 TG_BOT_DB）
[[d1_databases]]
binding = "TG_BOT_DB"
database_name = "tg-bot-db"
database_id = "<YOUR_DATABASE_ID>"

# 非敏感变量（敏感变量请用 wrangler secret 设置）
[vars]
ADMIN_IDS = "<YOUR_ADMIN_ID>"
ADMIN_GROUP_ID = "<YOUR_GROUP_ID>"
