name = "tg-contact-bot"
main = "TG_Bot_D1.js"
compatibility_date = "2024-09-23"

# D1 数据库绑定（部署后在 Dashboard 绑定）
[[d1_databases]]
binding = "TG_BOT_DB"
database_name = "tg-bot-db"
database_id = "<YOUR_DATABASE_ID>"

# 环境变量（敏感变量建议用 wrangler secret）
[vars]
ADMIN_IDS = "<YOUR_ADMIN_ID>"
ADMIN_GROUP_ID = "<YOUR_GROUP_ID>"

# Observability
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
